<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TUNG TUNG SAHUR PYTHON EDITION</title>

<style>

body{
    margin:0;
    font-family:Arial, Helvetica, sans-serif;
    background:#111;
    color:white;
}

.container{
    max-width:900px;
    margin:auto;
    padding:20px;
}

.card{
    background:#1d1d1d;
    border:1px solid #444;
    border-radius:10px;
    padding:20px;
    margin-bottom:20px;
}

input{
    width:100%;
    padding:12px;
    margin-top:10px;
    margin-bottom:10px;
    background:#222;
    border:1px solid #555;
    color:white;
    border-radius:5px;
}

button{
    padding:12px 20px;
    border:none;
    border-radius:5px;
    cursor:pointer;
    background:#00ccff;
    color:black;
    font-weight:bold;
    margin-top:10px;
}

button:hover{
    opacity:0.8;
}

.hidden{
    display:none;
}

#gachaResult{
    font-size:30px;
    margin-top:20px;
}

.inventory{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(80px,1fr));
    gap:10px;
}

.item{
    background:#222;
    border:1px solid #555;
    border-radius:10px;
    text-align:center;
    padding:15px;
    font-size:30px;
}

.leaderboard-entry{
    background:#222;
    padding:10px;
    margin-top:10px;
    border-radius:5px;
}

</style>
</head>

<body>

<div class="container">

<!-- AUTH -->
<div id="authSection" class="card">

<h1>TUNG TUNG SAHUR</h1>

<h2>Login</h2>

<input type="text" id="loginUsername" placeholder="Usuario">
<input type="password" id="loginPassword" placeholder="Contraseña">

<button onclick="login()">ENTRAR</button>

<hr>

<h2>Crear Cuenta</h2>

<input type="text" id="signupUsername" placeholder="Usuario">
<input type="email" id="signupEmail" placeholder="Email">
<input type="password" id="signupPassword" placeholder="Contraseña">

<button onclick="signup()">CREAR CUENTA</button>

</div>

<!-- APP -->
<div id="appSection" class="hidden">

<div class="card">

<h2>Bienvenido <span id="usernameDisplay"></span></h2>

<p>Coins: <span id="coinsDisplay">0</span></p>
<p>Clicks: <span id="clicksDisplay">0</span></p>
<p>Nivel Caos: <span id="chaosDisplay">1</span></p>

<button onclick="doChaosClick()">🌀 CLICK CAÓTICO 🌀</button>
<button onclick="loadQuote()">📜 FRASE</button>
<button onclick="logout()">🚪 SALIR</button>

<p id="quoteBox"></p>

</div>

<!-- PROFILE -->
<div class="card">

<h2>Perfil</h2>

<textarea id="bioInput" style="width:100%;height:100px;background:#222;color:white;"></textarea>

<button onclick="saveProfile()">GUARDAR PERFIL</button>

</div>

<!-- GACHA -->
<div class="card">

<h2>🎁 GACHA 🎁</h2>

<button onclick="pullGacha(10)">Caja Básica - 10 Coins</button>
<button onclick="pullGacha(50)">Caja Premium - 50 Coins</button>

<div id="gachaResult"></div>

</div>

<!-- INVENTORY -->
<div class="card">

<h2>Inventario</h2>

<div id="inventory" class="inventory"></div>

</div>

<!-- LEADERBOARD -->
<div class="card">

<h2>Leaderboard</h2>

<button onclick="loadLeaderboard()">ACTUALIZAR</button>

<div id="leaderboard"></div>

</div>

</div>

</div>

<script>

const API = "http://127.0.0.1:5000";

let currentUser = null;

async function signup(){

    const username = document.getElementById("signupUsername").value;
    const email = document.getElementById("signupEmail").value;
    const password = document.getElementById("signupPassword").value;

    const response = await fetch(API + "/signup",{
        method:"POST",
        headers:{
            "Content-Type":"application/json"
        },
        body:JSON.stringify({
            username,
            email,
            password
        })
    });

    const data = await response.json();

    alert(data.message);
}

async function login(){

    const username = document.getElementById("loginUsername").value;
    const password = document.getElementById("loginPassword").value;

    const response = await fetch(API + "/login",{
        method:"POST",
        headers:{
            "Content-Type":"application/json"
        },
        body:JSON.stringify({
            username,
            password
        })
    });

    const data = await response.json();

    if(data.success){

        currentUser = data.user;

        document.getElementById("authSection").classList.add("hidden");
        document.getElementById("appSection").classList.remove("hidden");

        updateUI();

        loadProfile();

    }else{
        alert(data.message);
    }
}

function logout(){

    currentUser = null;

    document.getElementById("authSection").classList.remove("hidden");
    document.getElementById("appSection").classList.add("hidden");
}

function updateUI(){

    document.getElementById("usernameDisplay").innerText = currentUser.username;
    document.getElementById("coinsDisplay").innerText = currentUser.coins;
    document.getElementById("clicksDisplay").innerText = currentUser.clicks;
    document.getElementById("chaosDisplay").innerText = currentUser.chaos_level;
}

async function doChaosClick(){

    const response = await fetch(API + "/click",{
        method:"POST",
        headers:{
            "Content-Type":"application/json"
        },
        body:JSON.stringify({
            username:currentUser.username
        })
    });

    const data = await response.json();

    currentUser.coins = data.coins;
    currentUser.clicks = data.clicks;
    currentUser.chaos_level = data.chaos_level;

    updateUI();
}

async function pullGacha(cost){

    const response = await fetch(API + "/gacha/pull",{
        method:"POST",
        headers:{
            "Content-Type":"application/json"
        },
        body:JSON.stringify({
            username:currentUser.username,
            cost:cost
        })
    });

    const data = await response.json();

    if(!data.success){
        alert(data.message);
        return;
    }

    const item = data.item;

    document.getElementById("gachaResult").innerHTML = `
        <div>
            <div style="font-size:60px">${item.emoji}</div>
            <div>${item.name}</div>
            <div>${item.rarity}</div>
        </div>
    `;

    await loadProfile();
}

async function loadProfile(){

    const response = await fetch(API + "/profile/" + currentUser.username);

    const data = await response.json();

    const profile = data.profile;

    currentUser.coins = profile.coins;
    currentUser.clicks = profile.clicks;
    currentUser.chaos_level = profile.chaos_level;

    updateUI();

    document.getElementById("bioInput").value = profile.bio;

    const inventory = document.getElementById("inventory");

    inventory.innerHTML = "";

    profile.inventory.forEach(item => {

        inventory.innerHTML += `
            <div class="item">
                <div>${item.emoji}</div>
                <small>${item.rarity}</small>
            </div>
        `;
    });
}

async function saveProfile(){

    const bio = document.getElementById("bioInput").value;

    const response = await fetch(API + "/profile/update",{
        method:"POST",
        headers:{
            "Content-Type":"application/json"
        },
        body:JSON.stringify({
            username:currentUser.username,
            bio:bio
        })
    });

    const data = await response.json();

    if(data.success){
        alert("Perfil guardado");
    }
}

async function loadLeaderboard(){

    const response = await fetch(API + "/leaderboard");

    const data = await response.json();

    const board = document.getElementById("leaderboard");

    board.innerHTML = "";

    data.leaderboard.forEach(user => {

        board.innerHTML += `
            <div class="leaderboard-entry">
                👤 ${user.username}
                <br>
                Nivel: ${user.chaos_level}
                <br>
                Clicks: ${user.clicks}
                <br>
                Coins: ${user.coins}
            </div>
        `;
    });
}

async function loadQuote(){

    const response = await fetch(API + "/chaos-quote");

    const data = await response.json();

    document.getElementById("quoteBox").innerText = data.quote;
}

</script>

</body>
</html>
